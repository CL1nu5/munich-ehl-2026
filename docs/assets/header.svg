    <line x1="56" y1="260" x2="606" y2="260" stroke="#6748FD"/>
    <text x="56" y="299" fill="#FBFAFF" font-size="14">One opening request.</text>
    <text x="243" y="299" fill="#FBFAFF" font-size="14">One model for the task.</text>
