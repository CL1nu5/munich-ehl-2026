<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Viktor Router</title>
  <desc id="desc">Model routing from offline agent traces. Built at Munich EHL, TUM.ai, 2026. A request branches to three models, with one route selected.</desc>
