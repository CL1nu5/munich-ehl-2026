    <path d="M700 171 H724 M700 180 H724 M700 189 H714" fill="none" stroke="#FBFAFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="814" cy="180" r="6" fill="#FFBD9E"/>
    <rect x="955" y="52" width="182" height="52" rx="10" fill="#25128A" stroke="#8171C5"/>
    <rect x="955" y="154" width="182" height="52" rx="10" fill="#FFBD9E"/>
    <rect x="955" y="256" width="182" height="52" rx="10" fill="#25128A" stroke="#8171C5"/>
    <text x="976" y="84" fill="#DDD7FF" font-size="14">Candidate A</text>
